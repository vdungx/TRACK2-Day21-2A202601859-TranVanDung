name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        run: |
          printf '%s' '${{ secrets.CLOUD_CREDENTIALS }}' > $GITHUB_WORKSPACE/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/sa-key.json" >> "$GITHUB_ENV"
      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc
      - name: Download currently deployed metrics
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage
          bucket = storage.Client().bucket(os.environ["CLOUD_BUCKET"])
          blob = bucket.blob("models/latest/metrics.json")
          try:
              blob.download_to_filename("/tmp/previous_metrics.json")
              print("Previous metrics downloaded.")
          except Exception as exc:
              print(f"No previous deployed metrics found; first deployment: {exc}")
          PY
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
      - name: Train model
        run: python src/train.py
      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"
      - name: Compare with deployed model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          current = json.load(open("outputs/metrics.json"))["accuracy"]
          previous_path = Path("/tmp/previous_metrics.json")
          if previous_path.exists():
              previous = json.load(open(previous_path))["accuracy"]
              if current < previous:
                  raise SystemExit(f"FAILED: new accuracy {current:.4f} < deployed accuracy {previous:.4f}")
              print(f"PASSED: new accuracy {current:.4f} >= deployed accuracy {previous:.4f}")
          else:
              print("PASSED: no previous model; allowing first deployment.")
          PY
      - name: Upload model and metrics to Cloud Storage
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage
          bucket = storage.Client().bucket(os.environ["CLOUD_BUCKET"])
          bucket.blob("models/latest/model.pkl").upload_from_filename("models/model.pkl")
          bucket.blob("models/latest/metrics.json").upload_from_filename("outputs/metrics.json")
          PY
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
      - name: Save metrics and report as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metrics-and-report
          path: |
            outputs/metrics.json
            outputs/report.txt

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'PY'
          import os
          accuracy = float(os.environ["ACCURACY"])
          if accuracy < 0.70:
              raise SystemExit(f"FAILED: accuracy {accuracy:.4f} < 0.70. Huy deploy.")
          print(f"PASSED: accuracy {accuracy:.4f} >= 0.70. Tiep tuc deploy.")
          PY

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart mlops-serve
            for attempt in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Health check attempt ${attempt} failed; retrying..."
              sleep 5
            done
            echo "Health check failed after retries."
            exit 1
